<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Goodreads Sentiment Analysis</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface-raised: #22263a;
      --border: #2e3350;
      --text-primary: #e8eaf6;
      --text-secondary: #8b90b8;
      --accent: #6c7ff5;
      --accent-hover: #8a97f7;
      --error-bg: #2d1a1a;
      --error-border: #7f2020;
      --error-text: #f87171;
      --star-filled: #f5a623;
      --star-empty: #3a3f60;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      --radius: 12px;
      --radius-sm: 8px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: var(--font);
      min-height: 100vh;
      padding: 40px 16px 80px;
      line-height: 1.6;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-secondary);
      font-size: 1rem;
    }

    .search-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }

    .search-row {
      display: flex;
      gap: 10px;
    }

    input[type="url"] {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-family: var(--font);
      font-size: 0.95rem;
      padding: 11px 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="url"]::placeholder {
      color: var(--text-secondary);
    }

    input[type="url"]:focus {
      border-color: var(--accent);
    }

    button[type="submit"] {
      background: var(--accent);
      border: none;
      border-radius: var(--radius-sm);
      color: #fff;
      cursor: pointer;
      font-family: var(--font);
      font-size: 0.95rem;
      font-weight: 600;
      padding: 11px 22px;
      transition: background 0.2s, opacity 0.2s;
      white-space: nowrap;
    }

    button[type="submit"]:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    button[type="submit"]:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .loading {
      display: none;
      align-items: center;
      gap: 12px;
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-top: 18px;
    }

    .loading.visible {
      display: flex;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Model download progress */
    .progress-wrap {
      display: none;
      flex-direction: column;
      gap: 6px;
      margin-top: 18px;
    }

    .progress-wrap.visible {
      display: flex;
    }

    .progress-track {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      width: 0%;
      transition: width 0.3s ease;
    }

    .progress-label {
      color: var(--text-secondary);
      font-size: 0.82rem;
    }

    .error-banner {
      display: none;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      border-radius: var(--radius-sm);
      color: var(--error-text);
      font-size: 0.9rem;
      padding: 12px 16px;
      margin-top: 16px;
    }

    .error-banner.visible {
      display: block;
    }

    .result-card {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: var(--shadow);
      animation: fadeIn 0.3s ease;
    }

    .result-card.visible {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .result-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .result-card h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.3;
    }

    .badge-cached {
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text-secondary);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 3px 10px;
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
      align-self: flex-start;
      margin-top: 3px;
    }

    .rating-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .stars {
      font-size: 1.4rem;
      letter-spacing: 2px;
      color: var(--star-filled);
    }

    .stars .empty {
      color: var(--star-empty);
    }

    .rating-numeric {
      color: var(--text-secondary);
      font-size: 0.9rem;
      font-weight: 500;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .author {
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-top: 2px;
    }

    .goodreads-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 500;
      text-decoration: none;
      margin-top: 16px;
    }

    .goodreads-link:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    .summary {
      color: var(--text-primary);
      font-size: 0.95rem;
      line-height: 1.75;
      margin-bottom: 20px;
    }

    .quotes {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .quote-label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .quote-label.positive { color: #4caf80; }
    .quote-label.negative { color: #f87171; }

    .quote-card {
      border-left: 3px solid;
      padding: 10px 14px;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      background: var(--surface-raised);
      font-size: 0.88rem;
      font-style: italic;
      line-height: 1.65;
      color: var(--text-primary);
    }

    .quote-card.positive { border-color: #4caf80; }
    .quote-card.negative { border-color: #f87171; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Goodreads Sentiment Analysis</h1>
      <p>Paste a Goodreads book URL to get AI-powered reader sentiment</p>
    </header>

    <div class="search-card">
      <form id="search-form">
        <div class="search-row">
          <input
            type="url"
            id="book-input"
            placeholder="https://www.goodreads.com/book/show/..."
            autocomplete="off"
            required
          />
          <button type="submit" id="analyze-btn">Analyze</button>
        </div>
        <div class="loading" id="loading">
          <div class="spinner"></div>
          <span id="loading-text">Fetching reviews&hellip;</span>
        </div>
        <div class="progress-wrap" id="progress-wrap">
          <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <span class="progress-label" id="progress-label">Downloading AI model (first time only)&hellip;</span>
        </div>
        <div class="error-banner" id="error-banner"></div>
      </form>
    </div>

    <div class="result-card" id="result-card">
      <div class="result-header">
        <div>
          <h2 id="result-title"></h2>
          <p class="author" id="result-author"></p>
        </div>
        <span class="badge-cached" id="badge-cached" style="display:none">Cached result</span>
      </div>
      <div class="rating-row">
        <div class="stars" id="stars-display"></div>
        <div class="rating-numeric" id="rating-numeric"></div>
      </div>
      <hr class="divider" />
      <p class="summary" id="result-summary"></p>
      <div class="quotes">
        <div>
          <div class="quote-label positive">Positive</div>
          <div class="quote-card positive" id="quote-positive"></div>
        </div>
        <div>
          <div class="quote-label negative">Negative</div>
          <div class="quote-card negative" id="quote-negative"></div>
        </div>
      </div>
      <a class="goodreads-link" id="goodreads-link" href="#" target="_blank" rel="noopener" style="display:none">
        ↗ View on Goodreads
      </a>
    </div>
  </div>

  <script type="module">
    import * as webllm from "https://esm.run/@mlc-ai/web-llm";

    const WORKER_URL = "https://fetch-page.nunseik.workers.dev/";
    const MODEL_ID   = "Qwen2.5-1.5B-Instruct-q4f16_1-MLC";
    const CACHE_TTL  = 30 * 24 * 60 * 60 * 1000;

    // ── DOM refs ──────────────────────────────────────────────────────────────
    const form          = document.getElementById('search-form');
    const input         = document.getElementById('book-input');
    const btn           = document.getElementById('analyze-btn');
    const loading       = document.getElementById('loading');
    const loadingText   = document.getElementById('loading-text');
    const progressWrap  = document.getElementById('progress-wrap');
    const progressFill  = document.getElementById('progress-fill');
    const progressLabel = document.getElementById('progress-label');
    const errorBanner   = document.getElementById('error-banner');
    const resultCard    = document.getElementById('result-card');
    const resultTitle   = document.getElementById('result-title');
    const resultAuthor  = document.getElementById('result-author');
    const badgeCached   = document.getElementById('badge-cached');
    const starsDisplay  = document.getElementById('stars-display');
    const ratingNum     = document.getElementById('rating-numeric');
    const resultSum     = document.getElementById('result-summary');
    const quotePos      = document.getElementById('quote-positive');
    const quoteNeg      = document.getElementById('quote-negative');
    const goodreadsLink = document.getElementById('goodreads-link');

    // ── Cache ─────────────────────────────────────────────────────────────────
    function cacheKey(url) { return `bsa:${url}`; }

    function cacheGet(url) {
      try {
        const raw = localStorage.getItem(cacheKey(url));
        if (!raw) return null;
        const { ts, data } = JSON.parse(raw);
        if (Date.now() - ts > CACHE_TTL) { localStorage.removeItem(cacheKey(url)); return null; }
        return data;
      } catch { return null; }
    }

    function cacheSet(url, data) {
      try { localStorage.setItem(cacheKey(url), JSON.stringify({ ts: Date.now(), data })); } catch {}
    }

    // ── Proxy fetch ───────────────────────────────────────────────────────────
    async function fetchGoodreadsPage(url) {
      const res = await fetch(`${WORKER_URL}?url=${encodeURIComponent(url)}`);
      if (!res.ok) throw new Error(`Worker returned ${res.status}`);
      return res.text();
    }

    // ── Quote picker ─────────────────────────────────────────────────────────

    // ── DOM parsing ───────────────────────────────────────────────────────────
    function parseBookPage(html) {
      const doc = new DOMParser().parseFromString(html, "text/html");

      const title =
        doc.querySelector("h1.Text__title1")?.textContent?.trim() ||
        doc.querySelector("h1[data-testid='bookTitle']")?.textContent?.trim() ||
        null;

      const author =
        doc.querySelector("span.ContributorLink__name")?.textContent?.trim() ||
        doc.querySelector(".authorName span[itemprop='name']")?.textContent?.trim() ||
        null;

      const ratingText =
        doc.querySelector("div.RatingStatistics__rating")?.textContent?.trim() ||
        doc.querySelector("[data-testid='ratingsAndReviews'] .average")?.textContent?.trim() ||
        null;
      const rating = ratingText ? parseFloat(ratingText) : null;

      const reviews = [
        ...doc.querySelectorAll(".ReviewText__content"),
        ...doc.querySelectorAll(".reviewText span[id]"),
      ]
        .map(el => el.textContent.trim())
        .filter(t => t.length > 50)
        .filter((t, i, arr) => arr.indexOf(t) === i) // deduplicate
        .slice(0, 30);

      return { title, author, rating, reviews };
    }

    // ── WebLLM ────────────────────────────────────────────────────────────────
    let engine = null;

    async function getEngine() {
      if (engine) return engine;

      progressWrap.classList.add('visible');
      engine = await webllm.CreateMLCEngine(MODEL_ID, {
        initProgressCallback: ({ progress, text }) => {
          progressFill.style.width = `${Math.round(progress * 100)}%`;
          progressLabel.textContent = text || "Downloading AI model (first time only)…";
        },
      });
      progressWrap.classList.remove('visible');
      return engine;
    }

    async function llmCall(system, user) {
      const e = await getEngine();
      const reply = await e.chat.completions.create({
        messages: [
          { role: "system", content: system },
          { role: "user", content: user },
        ],
      });
      return reply.choices[0].message.content.trim();
    }

    function reviewList(reviews) {
      return reviews.slice(0, 15).map((r, i) => `${i + 1}. ${r.slice(0, 150)}`).join("\n");
    }

    async function pickReview(reviews, polarity) {
      const labels = {
        positive: "most enthusiastic and positive",
        negative: "most critical and negative",
        neutral:  "most balanced and neutral (neither strongly positive nor negative)",
      };
      const text = await llmCall(
        "You are a helpful assistant. Reply with only a single number, nothing else.",
        `Here are reader reviews:\n${reviewList(reviews)}\n\nWhich number is the ${labels[polarity]} review? Reply with only the number.`
      );
      const idx = parseInt(text.match(/\d+/)?.[0] ?? "1", 10);
      return reviews[Math.min(idx - 1, reviews.length - 1)] ?? reviews[0];
    }

    async function writeSummary(title, author, positiveReview, neutralReview, negativeReview) {
      return llmCall(
        "You are a literary critic. Reply with only the summary, no titles or extra commentary.",
        `Book: ${title || "Unknown"}\nAuthor: ${author || "Unknown"}\n\n` +
        `A reader who loved it said:\n${positiveReview}\n\n` +
        `A reader with a balanced view said:\n${neutralReview}\n\n` +
        `A reader who disliked it said:\n${negativeReview}\n\n` +
        `Write a balanced summary of what readers think.`
      );
    }

    // ── UI helpers ────────────────────────────────────────────────────────────
    function setLoading(on) {
      btn.disabled = on;
      loading.classList.toggle('visible', on);
    }

    function setLoadingText(msg) {
      loadingText.textContent = msg;
    }

    function showError(msg) {
      errorBanner.textContent = msg;
      errorBanner.classList.add('visible');
    }

    function clearError() {
      errorBanner.textContent = '';
      errorBanner.classList.remove('visible');
    }

    function renderStars(rating) {
      const rounded = Math.round(rating * 2) / 2;
      let html = '';
      for (let i = 1; i <= 5; i++) {
        if (i <= rounded) {
          html += '<span>&#9733;</span>';
        } else if (i - 0.5 === rounded) {
          html += '<span style="opacity:0.55">&#9733;</span>';
        } else {
          html += '<span class="empty">&#9734;</span>';
        }
      }
      return html;
    }

    function renderResult(data, cached) {
      resultTitle.textContent   = data.title || "Unknown title";
      resultAuthor.textContent  = data.author ? `by ${data.author}` : "";
      starsDisplay.innerHTML    = renderStars(data.avg_rating ?? 0);
      ratingNum.textContent     = `${(data.avg_rating ?? 0).toFixed(1)} / 5`;
      resultSum.textContent     = data.summary || "";
      quotePos.textContent      = data.positive ? `"${data.positive}"` : "—";
      quoteNeg.textContent      = data.negative ? `"${data.negative}"` : "—";
      badgeCached.style.display = cached ? "inline-block" : "none";
      if (data.goodreads_url) {
        goodreadsLink.href          = data.goodreads_url;
        goodreadsLink.style.display = "inline-flex";
      } else {
        goodreadsLink.style.display = "none";
      }
      resultCard.classList.add('visible');
    }

    // ── Main handler ──────────────────────────────────────────────────────────
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = input.value.trim();
      if (!url) return;

      if (!url.includes("goodreads.com/book/show/")) {
        showError("Please paste a Goodreads book URL (goodreads.com/book/show/...)");
        return;
      }

      clearError();
      resultCard.classList.remove('visible');
      setLoading(true);
      setLoadingText("Fetching reviews…");

      try {
        const cached = cacheGet(url);
        if (cached) {
          renderResult(cached, true);
          return;
        }

        const html = await fetchGoodreadsPage(url);
        const { title, author, rating, reviews } = parseBookPage(html);

        if (reviews.length === 0) {
          throw new Error("No reviews found on this page. Make sure it's a book page, not a search result.");
        }

        setLoadingText("Warming up AI model…");
        const positive = await pickReview(reviews, "positive");

        setLoadingText("Finding critical review…");
        const negative = await pickReview(reviews, "negative");

        setLoadingText("Finding balanced review…");
        const neutral = await pickReview(reviews, "neutral");

        setLoadingText("Writing summary…");
        const summary = await writeSummary(title, author, positive, neutral, negative);

        const avg_rating = rating ?? 0;
        const result = { title, author, summary, positive, negative, avg_rating, goodreads_url: url };

        cacheSet(url, result);
        renderResult(result, false);
      } catch (err) {
        showError(err.message || "Something went wrong. Please try again.");
      } finally {
        setLoading(false);
        progressWrap.classList.remove('visible');
      }
    });
  </script>
</body>
</html>
